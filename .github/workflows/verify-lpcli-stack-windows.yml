name: Verify Launchpad CLI startup on Windows

on:
  push:
    branches: [verification/lpcli-windows-cli-stack]

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 822e0f8bb08fa2bce544538f89435bcfcd47bedc
          persist-credentials: false
      - name: Inspect the checkout and select Rust
        run: |
          if ((git rev-parse HEAD) -ne '822e0f8bb08fa2bce544538f89435bcfcd47bedc') { exit 1 }
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.97.1
          rustc --version
      - name: Launch the debug CLI in subprocess tests
        run: cargo test --locked --test skills
      - name: Verify the actual PE stack reserve
        if: always()
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'target/debug/lpcli.exe').Path)
          $optional = [BitConverter]::ToInt32($bytes, 0x3c) + 24
          if ([BitConverter]::ToUInt16($bytes, $optional) -ne 0x20b) { exit 1 }
          $reserve = [BitConverter]::ToUInt64($bytes, $optional + 72)
          $commit = [BitConverter]::ToUInt64($bytes, $optional + 80)
          Write-Output "PE stack reserve: $reserve bytes; initial commit: $commit bytes"
          if ($reserve -ne 4194304 -or $commit -ge 1048576) { exit 1 }
